name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: madix, POSTGRES_PASSWORD: madix, POSTGRES_DB: madix_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U madix" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://madix:madix@localhost:5432/madix_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: npm ci
      - run: npm run typecheck -w apps/api
      - run: npm run typecheck -w apps/web
      - run: npm test
      - run: npm run build
